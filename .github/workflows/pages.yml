name: Validar y publicar Super Técnico

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Verificar fórmulas de las calculadoras
        run: node tests/test_calculations.js

      - name: Verificar diseñador de conductos
        run: node tests/test_duct_designer.js

      - name: Verificar panel privado de visitas
        run: node --check assets/analytics.js

      - name: Verificar catálogo de plataformas embebidas
        run: |
          node --check assets/embedded-platforms.js
          php -l api/embedded-platforms.php
          php -l api/index.php

      - name: Verificar validación de campo y límites de ElectroIA
        run: |
          node --check archivo-tecnico-47097e44267b9cb111636b84823f1d47/app.js
          node tests/electroia_guardrails_smoke.mjs
          node tests/electroia_toolkit_smoke.mjs
          node tests/electroia_professional_benchmark.mjs
          node tests/electroia_technical_package.mjs
          php -l api/electroia.php
          php -l api/electroia-validation.php

      - name: Verificar datos derivados y panel de evolución
        run: |
          node --check assets/updates.js
          python tools/normalize_symbol_library.py --check
          python tools/audit_electroia_engine.py --check
          node tools/build_electroia_release_report.mjs --check
          python tools/build_project_roadmap.py --check

      - name: Verificar buscador universal de datasheets
        run: node tests/test_datasheet_finder.js

      - name: Construir sitio público
        run: python tools/build_static.py --source . --output dist

      - name: Configurar GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Subir artefacto de Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
